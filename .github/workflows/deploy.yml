name: Build and Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: HOSTINGER

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check Hostinger secrets
        run: |
          echo "HOST: ${{ secrets.HOSTINGER_HOST != '' }}"
          echo "PORT: ${{ secrets.HOSTINGER_PORT != '' }}"
          echo "USERNAME: ${{ secrets.HOSTINGER_USERNAME != '' }}"
          echo "PASSWORD: ${{ secrets.HOSTINGER_PASSWORD != '' }}"

      - name: Test SSH connection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" \
            ssh \
            -o StrictHostKeyChecking=no \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo SSH_CONNECTION_OK"

      - name: Deploy to Hostinger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: wangyucode/sftp-upload-action@v2.0.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          localDir: ./dist
          remoteDir: domains/distribuidorabriancescomenjivar.com/public_html